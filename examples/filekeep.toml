[[entries]]
id = "hosts"
destination = '${HOME}/Documents/Settings-Windows/Files/HOSTS file'
filename = '${HOST}-HOSTS-${date:yyyyMMdd}.txt'
skip_if_unchanged = true
[entries.source]
type = "hosts_file"

[[entries]]
id = "environment"
destination = '${HOME}/Documents/Settings-Windows/Files/Environment Variables'
filename = '${HOST}-ENVARS-${date:yyyyMMdd}.txt'
skip_if_unchanged = true
[entries.source]
type = "environment"
scopes = ["machine", "user"]

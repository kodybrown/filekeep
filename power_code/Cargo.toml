[package]
name = "power_code"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Reusable configuration, path, template, and file primitives"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
hostname = "0.4"
quick-xml = { version = "0.42", features = ["serialize"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tempfile = "3"
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
fs2 = "0.4"

[lints]
workspace = true
